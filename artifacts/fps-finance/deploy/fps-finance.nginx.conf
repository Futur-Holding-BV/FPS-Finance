# /etc/nginx/sites-available/fps-finance
# Nginx vhost for finance.futurholding.com — FINANCE_VPS_01
# Managed by deployment script; do not edit manually.

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name finance.futurholding.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination + reverse proxy to Node on loopback
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finance.futurholding.com;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/finance.futurholding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.futurholding.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/finance.futurholding.com/chain.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/fps-finance.access.log combined;
    error_log  /var/log/nginx/fps-finance.error.log warn;

    # Proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Buffer settings
    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;

    # --- Routes ---
    # Finance API
    location /finance-api {
        proxy_pass http://127.0.0.1:22044;
    }

    # Main application (SPA + server routes)
    location / {
        proxy_pass http://127.0.0.1:22044;
    }

    # Reject hidden paths
    location ~ /\. {
        deny all;
    }
}
