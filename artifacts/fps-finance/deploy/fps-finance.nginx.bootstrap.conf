# HTTP-only vhost used by the first deployment to obtain the TLS certificate.
# The deploy script replaces it with fps-finance.nginx.conf after Certbot succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name finance.futurholding.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}