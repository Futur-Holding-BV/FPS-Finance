openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: finance-auth
    description: Finance-local authentication
  - name: finance
    description: Finance application data
  - name: finance-sync
    description: Isolated Connect synchronization
  - name: finance-invoices
    description: Source-isolated sales invoice imports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /finance/auth/login:
    post:
      operationId: financeLogin
      tags: [finance-auth]
      summary: Sign in to Finance using the local identity copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceLoginInput"
      responses:
        "200":
          description: Signed-in Finance session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/logout:
    post:
      operationId: financeLogout
      tags: [finance-auth]
      summary: End the current Finance session
      responses:
        "204":
          description: Session ended
  /finance/auth/me:
    get:
      operationId: financeMe
      tags: [finance-auth]
      summary: Read the current Finance session
      responses:
        "200":
          description: Current Finance session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSession"
        "401":
          description: No active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/invitations/inspect:
    post:
      operationId: financeInspectInvitation
      tags: [finance-auth]
      summary: Inspect an invitation token and return its metadata without consuming it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceInvitationTokenInput"
      responses:
        "200":
          description: Invitation metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceInvitationInspect"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/invitations/accept:
    post:
      operationId: financeAcceptInvitation
      tags: [finance-auth]
      summary: Accept an invitation — set a strong password and receive TOTP setup material and one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAcceptInvitationInput"
      responses:
        "200":
          description: TOTP setup material and one-time recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAcceptInvitationResult"
        "400":
          description: Invalid or expired token, or password too weak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/invitations/complete:
    post:
      operationId: financeCompleteInvitation
      tags: [finance-auth]
      summary: Complete an invitation by verifying the first TOTP code, activating the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCompleteInvitationInput"
      responses:
        "200":
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSuccessResponse"
        "400":
          description: Invalid token or incorrect TOTP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/2fa/revoke:
    post:
      operationId: financeRevokeTwoFactor
      tags: [finance-auth]
      summary: Revoke own two-factor authentication using password and a current second factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceRevokeTwoFactorInput"
      responses:
        "200":
          description: Two-factor authentication revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid password or second factor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/auth/invitations:
    post:
      operationId: financeCreateInvitation
      tags: [finance-auth]
      summary: Admin — create an invitation by email and return the delivery state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCreateInvitationInput"
      responses:
        "201":
          description: Invitation created and delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceInvitationDelivery"
        "400":
          description: Invalid email or person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/status:
    get:
      operationId: getFinanceStatus
      tags: [finance]
      summary: Read Finance runtime and degraded-mode status
      responses:
        "200":
          description: Finance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceStatus"
  /finance/dashboard:
    get:
      operationId: getFinanceDashboard
      tags: [finance]
      summary: Read the Finance landing dashboard
      responses:
        "200":
          description: Finance dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDashboard"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/administrations:
    get:
      operationId: listFinanceAdministrations
      tags: [finance]
      summary: List local Finance administration copies
      responses:
        "200":
          description: Finance administrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceAdministration"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/people:
    get:
      operationId: listFinancePeople
      tags: [finance]
      summary: List local Finance identity copies and roles
      responses:
        "200":
          description: Finance people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancePerson"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/sync/status:
    get:
      operationId: getFinanceSyncStatus
      tags: [finance-sync]
      summary: Read the Connect sync adapter status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSyncStatus"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/sync/run:
    post:
      operationId: runFinanceSync
      tags: [finance-sync]
      summary: Run an idempotent one-way Connect sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSyncResult"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Finance sync permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/sales-invoices:
    get:
      operationId: listFinanceSalesInvoices
      tags: [finance-invoices]
      summary: List canonical imported sales invoices
      responses:
        "200":
          description: Imported sales invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceSalesInvoice"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Finance invoice view permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/sales-invoice-imports/status:
    get:
      operationId: listFinanceSalesInvoiceImportStatuses
      tags: [finance-invoices]
      summary: Read the independent import status for each sales invoice source
      responses:
        "200":
          description: Per-source invoice import statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceSalesInvoiceImportStatus"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Finance invoice view permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/sales-invoice-imports/{source}/run:
    post:
      operationId: runFinanceSalesInvoiceImport
      tags: [finance-invoices]
      summary: Run one source-isolated and idempotent sales invoice import
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FinanceSalesInvoiceSource"
      responses:
        "200":
          description: Per-source invoice import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSalesInvoiceImportResult"
        "400":
          description: Unknown invoice source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Finance invoice import permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finance/audit-events:
    get:
      operationId: listFinanceAuditEvents
      tags: [finance]
      summary: List append-only payment and period-close audit events
      responses:
        "200":
          description: Finance audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceAuditEvent"
        "401":
          description: Finance login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Finance audit permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FinanceSuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    FinanceLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
        secondFactor:
          description: TOTP code (6 digits) or a one-time recovery code. Omit on the first factor-only attempt; supply when the server responds 401 with a secondFactorRequired hint.
          type: ["string", "null"]
    FinanceInvitationTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    FinanceInvitationInspect:
      type: object
      required: [email, name, expiresAt]
      properties:
        email:
          type: string
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
    FinanceAcceptInvitationInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          description: Strong password chosen by the invitee; must meet the server-side strength policy
          minLength: 12
    FinanceAcceptInvitationResult:
      type: object
      required: [personLabel, otpauthUri, setupKey, recoveryCodes]
      properties:
        personLabel:
          type: string
          description: Human-readable label for the TOTP account entry (e.g. "Alice — Finance")
        otpauthUri:
          type: string
          description: otpauth:// URI to be rendered as a QR code in an authenticator app
        setupKey:
          type: string
          description: Plain-text TOTP secret for manual entry in authenticator apps
        recoveryCodes:
          type: array
          description: One-time recovery codes; shown once and never returned again
          items:
            type: string
    FinanceCompleteInvitationInput:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
          minLength: 1
        code:
          type: string
          description: 6-digit TOTP code from the authenticator app
          pattern: '^\d{6}$'
    FinanceRevokeTwoFactorInput:
      type: object
      required: [password, secondFactor]
      properties:
        password:
          type: string
          minLength: 1
        secondFactor:
          type: string
          description: Current TOTP code (6 digits) or a one-time recovery code
          minLength: 1
    FinanceCreateInvitationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
    FinanceInvitationDelivery:
      type: object
      required: [email, deliveryState]
      properties:
        email:
          type: string
        deliveryState:
          type: string
          enum: [sent, queued, failed]
        failureReason:
          type: ["string", "null"]
    FinancePerson:
      type: object
      required: [id, name, email, employed, syncState, roles, secondFactorEnabled]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        employed:
          type: boolean
        syncState:
          type: string
          enum: [synced, pending, offline]
        roles:
          type: array
          items:
            type: string
        secondFactorEnabled:
          type: boolean
        sourceUpdatedAt:
          type: ["string", "null"]
          format: date-time
    FinanceSession:
      type: object
      required: [person, permissions, issuedAt]
      properties:
        person:
          $ref: "#/components/schemas/FinancePerson"
        permissions:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
    FinanceStatus:
      type: object
      required: [service, database, connectSync, mode, message]
      properties:
        service:
          type: string
          enum: [online]
        database:
          type: string
          enum: [connected, degraded]
        connectSync:
          type: string
          enum: [healthy, degraded, never-run]
        mode:
          type: string
          enum: [normal, degraded]
        message:
          type: string
    FinanceAdministration:
      type: object
      required: [id, name, shortName, source, active]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        source:
          type: string
          enum: [connect, finance]
        active:
          type: boolean
    FinanceDashboard:
      type: object
      required: [administrationCount, peopleCount, pendingSyncCount, permissions, recentEvents]
      properties:
        administrationCount:
          type: number
        peopleCount:
          type: number
        pendingSyncCount:
          type: number
        permissions:
          type: array
          items:
            type: string
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/FinanceEvent"
    FinanceEvent:
      type: object
      required: [id, title, detail, occurredAt, tone]
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
        tone:
          type: string
          enum: [neutral, success, warning]
    FinanceSyncStatus:
      type: object
      required: [state, lastAttemptAt, lastSuccessAt, attempts, message]
      properties:
        state:
          type: string
          enum: [healthy, degraded, never-run]
        lastAttemptAt:
          type: ["string", "null"]
          format: date-time
        lastSuccessAt:
          type: ["string", "null"]
          format: date-time
        attempts:
          type: number
        message:
          type: string
    FinanceSyncResult:
      type: object
      required: [state, processed, changed, skipped, message]
      properties:
        state:
          type: string
          enum: [healthy, degraded]
        processed:
          type: number
        changed:
          type: number
        skipped:
          type: number
        message:
          type: string
    FinanceSalesInvoiceSource:
      type: string
      enum: [fps-connect, fps-one-platform]
    FinanceSalesInvoice:
      type: object
      required:
        [id, source, sourceDocumentId, sourceVersion, sourceAdministrationId, administrationId, administrationName, invoiceNumber, status, issueDate, dueDate, customerName, currency, subtotalAmount, vatAmount, totalAmount, sourceUpdatedAt, importedAt]
      properties:
        id:
          type: string
        source:
          $ref: "#/components/schemas/FinanceSalesInvoiceSource"
        sourceDocumentId:
          type: string
        sourceVersion:
          type: string
        sourceAdministrationId:
          type: ["string", "null"]
        administrationId:
          type: string
        administrationName:
          type: string
        invoiceNumber:
          type: string
        status:
          type: string
          enum: [draft, issued, paid, cancelled, credit]
        issueDate:
          type: string
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        customerName:
          type: string
        currency:
          type: string
        subtotalAmount:
          type: number
        vatAmount:
          type: number
        totalAmount:
          type: number
        sourceUpdatedAt:
          type: string
          format: date-time
        importedAt:
          type: string
          format: date-time
    FinanceSalesInvoiceImportStatus:
      type: object
      required:
        [source, state, configured, lastAttemptAt, lastSuccessAt, attempts, processed, changed, skipped, cursor, message]
      properties:
        source:
          $ref: "#/components/schemas/FinanceSalesInvoiceSource"
        state:
          type: string
          enum: [healthy, degraded, never-run]
        configured:
          type: boolean
        lastAttemptAt:
          type: ["string", "null"]
          format: date-time
        lastSuccessAt:
          type: ["string", "null"]
          format: date-time
        attempts:
          type: number
        processed:
          type: number
        changed:
          type: number
        skipped:
          type: number
        cursor:
          type: ["string", "null"]
        message:
          type: string
    FinanceSalesInvoiceImportResult:
      type: object
      required:
        [source, state, configured, processed, changed, skipped, cursor, message]
      properties:
        source:
          $ref: "#/components/schemas/FinanceSalesInvoiceSource"
        state:
          type: string
          enum: [healthy, degraded]
        configured:
          type: boolean
        processed:
          type: number
        changed:
          type: number
        skipped:
          type: number
        cursor:
          type: ["string", "null"]
        message:
          type: string
    FinanceAuditEvent:
      type: object
      required:
        [id, action, actorPersonId, actorName, administrationId, administrationName, reference, amount, currency, outcome, occurredAt, recordedAt]
      properties:
        id:
          type: string
        action:
          type: string
          enum: [payment_executed, period_closed]
        actorPersonId:
          type: string
        actorName:
          type: string
        administrationId:
          type: string
        administrationName:
          type: string
        reference:
          type: string
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        outcome:
          type: string
          enum: [completed]
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
